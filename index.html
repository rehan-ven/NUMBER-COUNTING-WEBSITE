
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="artifact-type" content="narrative">
<meta name="design-style" content="canopy">
<title>The Wonderful World of Numbers — Number Town Storybook</title>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..600&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@1.43.0/dist/umd/lucide.min.js"></script>
<style>
:root {
  color-scheme: light;

  /* 1. Canopy :root tokens */
  --background: #faf6ef;
  --surface-container-low: #f0eae0;
  --surface-container: #e8e0d2;
  --surface-container-high: #ddd3c2;

  --on-surface: #2a302b;
  --on-surface-variant: #4a524b;

  --outline: #737872;
  --outline-variant: #cbc5b8;

  --primary: #366948;
  --on-primary: #ffffff;
  --primary-container: #d8efe0;
  --on-primary-container: #1f4d30;
  --secondary: #5c635c;
  --tertiary: #8f5822;
  --tertiary-container: #f2d4a7;
  --on-tertiary-container: #6e3f0c;
  --error: #b83230;
  --on-error: #ffffff;

  --data-1: #366948;
  --data-2: #8f5822;
  --data-3: #a85438;
  --data-4: #4b6b78;
  --data-context: #b5b0a3;

  --font-headline: 'Literata', serif;
  --font-body: 'Nunito Sans', sans-serif;
  --font-label: 'Geist Mono', monospace;

  --rounded: 0.625rem;
  --rounded-lg: 1rem;
  --rounded-book: 1.375rem;
  --rounded-full: 9999px;

  --shadow-soft: 0 4px 20px rgb(42 48 43 / 0.06);
  --shadow-soft-hover: 0 8px 28px rgb(42 48 43 / 0.11);
  --shadow-book: 0 12px 36px rgb(42 48 43 / 0.09);
  --border-soft: 1px solid rgb(203 197 184 / 0.72);
  --border-dashed: 2px dashed rgb(143 88 34 / 0.4);
  --focus-glow: 0 0 0 4px rgb(54 105 72 / 0.22);

  /* 2. Shared foundation tokens */
  --positive: #2d6a4f;
  --positive-bg: #d8efe0;
  --warning: #9c611b;
  --warning-bg: #f8e5c2;
  --error-bg: #fbe2e1;
  --focus: #366948;

  /* Type scale (Narrative) */
  --display-size: clamp(2.1rem, 1.4rem + 2.8vw, 3.25rem);
  --headline-size: clamp(1.55rem, 1.15rem + 1.5vw, 2.2rem);
  --subhead-size: clamp(1.15rem, 1.05rem + 0.45vw, 1.375rem);
  --body-size: clamp(1rem, 0.96rem + 0.2vw, 1.125rem);
  --label-size: clamp(0.75rem, 0.72rem + 0.12vw, 0.8125rem);

  /* Spacing scale */
  --space-xs: 0.25rem;
  --space-sm: 0.5rem;
  --space-md: 1rem;
  --space-lg: 1.5rem;
  --space-xl: 2.5rem;
  --space-2xl: 4rem;

  /* Motion */
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  --dur-micro: 120ms;
  --dur-short: 220ms;
  --dur-long: 420ms;

  /* 3. Storybook illustration palette (all named tokens) */
  --illus-sky: #dbe8ec;
  --illus-sky-warm: #f5ebd6;
  --illus-cloud: #fdfaf3;
  --illus-meadow: #c8dfc4;
  --illus-grass: #7da672;
  --illus-leaf-dark: #285237;
  --illus-mustard: #e6b84c;
  --illus-mustard-soft: #f5df9d;
  --illus-terracotta: #c45c3e;
  --illus-terracotta-soft: #ecc1b2;
  --illus-dusty-blue: #587b8c;
  --illus-dusty-blue-soft: #c9dce4;
  --illus-brown: #7a4e2d;
  --illus-brown-light: #b5845c;
  --illus-cream: #fcf8f0;
  --illus-gold: #d99b26;
  --illus-pink: #df8282;
  --illus-white: #ffffff;
  --illus-skin-lily: #f4cbb0;
  --illus-skin-oliver: #e5b28a;
  --illus-hair-lily: #7c3f23;
  --illus-hair-oliver: #3a2b22;
  --paper-wash: radial-gradient(circle at 18% 12%, rgb(242 212 167 / 0.24), transparent 52%),
                radial-gradient(circle at 86% 88%, rgb(216 239 224 / 0.28), transparent 52%);
}

/* Base reset */
*, *::before, *::after { box-sizing: border-box; }
html, body {
  overflow-x: clip;
  margin: 0;
  padding: 0;
  background-color: var(--background);
  background-image: var(--paper-wash);
  color: var(--on-surface);
  font-family: var(--font-body);
  font-size: var(--body-size);
  line-height: 1.62;
  -webkit-font-smoothing: antialiased;
}
header { position: static !important; }
button, input, select, textarea { font-family: inherit; }

:focus-visible {
  outline: 3px solid var(--focus);
  outline-offset: 2px;
}

.storybook-shell {
  max-width: 1120px;
  margin: 0 auto;
  padding: var(--space-md) var(--space-lg) var(--space-2xl);
  display: grid;
  gap: var(--space-lg);
}
.storybook-shell * { min-width: 0; }

/* Masthead & Chapter Almanac Strip */
.book-header {
  display: grid;
  gap: var(--space-md);
  background: var(--surface-container-low);
  border-radius: var(--rounded-lg);
  padding: var(--space-md) var(--space-lg);
  border: var(--border-soft);
}

.book-header-top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-md);
}

.book-brand {
  display: flex;
  align-items: center;
  gap: var(--space-md);
}

.book-title-mini {
  font-family: var(--font-headline);
  font-weight: 700;
  font-size: 1.125rem;
  line-height: 1.2;
  color: var(--on-surface);
  margin: 0;
}

.book-subtitle-mini {
  font-family: var(--font-label);
  font-size: var(--label-size);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--tertiary);
  margin: 0;
}

.header-tools {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-sm);
}

.pill-stat {
  display: inline-flex;
  align-items: center;
  gap: 0.4rem;
  background: var(--illus-cream);
  border: var(--border-soft);
  border-radius: var(--rounded-full);
  padding: 0.375rem 0.875rem;
  font-size: 0.875rem;
  font-weight: 700;
  color: var(--on-surface);
  min-height: 44px;
}

.pill-stat.is-highlight {
  background: var(--primary-container);
  color: var(--on-primary-container);
}

/* Canopy Almanac Chapter Strip */
.chapter-strip {
  background: var(--illus-cream);
  border-radius: var(--rounded);
  padding: 0.625rem 0.875rem;
  border: var(--border-soft);
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-sm);
}

.chapter-strip-label {
  font-family: var(--font-label);
  font-size: var(--label-size);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--secondary);
  font-weight: 600;
}

.chapter-cells {
  display: flex;
  flex-wrap: wrap;
  gap: 0.35rem;
}

.chapter-cell {
  font-family: var(--font-label);
  font-size: 0.78rem;
  font-weight: 600;
  min-width: 44px;
  min-height: 44px;
  padding: 0 0.55rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.25rem;
  border-radius: var(--rounded);
  border: 1px solid transparent;
  background: var(--surface-container-high);
  color: var(--on-surface-variant);
  cursor: pointer;
  transition: transform var(--dur-micro) var(--ease-out), background-color var(--dur-short) var(--ease-out);
}
.chapter-cell:hover {
  background: var(--tertiary-container);
  color: var(--on-tertiary-container);
  transform: translateY(-1px);
}
.chapter-cell.is-done {
  background: var(--primary-container);
  color: var(--on-primary-container);
}
.chapter-cell.is-current {
  background: var(--primary);
  color: var(--on-primary);
  box-shadow: var(--shadow-soft);
}

/* Main Storybook Page Canvas */
.storybook-page {
  background: var(--illus-cream);
  border-radius: var(--rounded-book);
  border: var(--border-soft);
  box-shadow: var(--shadow-book);
  padding: var(--space-xl);
  display: grid;
  gap: var(--space-lg);
  position: relative;
  animation: pageTurnIn var(--dur-long) var(--ease-out);
}

@keyframes pageTurnIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.page-header-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--space-md);
  border-bottom: var(--border-soft);
  padding-bottom: var(--space-md);
}

.page-kicker {
  font-family: var(--font-body);
  font-weight: 800;
  font-size: 0.78rem;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--tertiary);
  margin: 0 0 0.25rem;
}

.page-title {
  font-family: var(--font-headline);
  font-weight: 600;
  font-size: var(--headline-size);
  line-height: 1.15;
  letter-spacing: -0.015em;
  color: var(--on-surface);
  margin: 0;
}

.page-title.is-display {
  font-size: var(--display-size);
}

.page-lead {
  color: var(--on-surface-variant);
  max-width: 65ch;
  margin: 0.4rem 0 0;
}

.id-hint {
  display: inline-block;
  font-size: 0.875rem;
  color: var(--secondary);
  font-style: italic;
  margin-left: 0.25rem;
}

.sticker-status-pill {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5rem 0.9rem;
  border-radius: var(--rounded-full);
  background: var(--surface-container-low);
  border: var(--border-soft);
  font-size: 0.875rem;
  font-weight: 700;
  color: var(--on-surface-variant);
}
.sticker-status-pill.is-earned {
  background: var(--tertiary-container);
  color: var(--on-tertiary-container);
}

/* Two-column / Adaptive Storybook Layouts */
.spread-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr);
  gap: var(--space-lg);
  align-items: start;
}

.spread-grid.is-equal {
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
}

.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(220px, 100%), 1fr));
  gap: var(--space-md);
}

/* Canopy Cards */
.card {
  background: var(--surface-container-low);
  border-radius: var(--rounded-lg);
  padding: var(--space-lg);
  border: 0;
  display: grid;
  gap: var(--space-md);
}
.card.is-leaf-highlight {
  background: var(--primary-container);
  color: var(--on-primary-container);
}
.card.is-interactive {
  box-shadow: var(--shadow-soft);
  transition: transform var(--dur-short) var(--ease-out), box-shadow var(--dur-short) var(--ease-out);
}
.card.is-interactive:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-soft-hover);
}
.card.is-cream {
  background: var(--background);
  border: var(--border-soft);
}

.card-heading {
  font-family: var(--font-headline);
  font-weight: 600;
  font-size: var(--subhead-size);
  line-height: 1.25;
  margin: 0;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  min-height: 44px;
  padding: 0.625rem 1.25rem;
  border-radius: var(--rounded);
  border: 1px solid transparent;
  font-family: var(--font-body);
  font-weight: 700;
  font-size: 0.96rem;
  line-height: 1.2;
  cursor: pointer;
  text-decoration: none;
  transition: transform var(--dur-micro) var(--ease-out), background-color var(--dur-short) var(--ease-out), box-shadow var(--dur-short) var(--ease-out);
}
.btn:hover:not(:disabled) { transform: translateY(-1px); }
.btn:active:not(:disabled) { transform: translateY(0); }
.btn:disabled { opacity: 0.48; cursor: not-allowed; }

.btn-primary {
  background: var(--primary);
  color: var(--on-primary);
  box-shadow: var(--shadow-soft);
}
.btn-primary:hover:not(:disabled) {
  background: var(--illus-leaf-dark);
  box-shadow: var(--shadow-soft-hover);
}

.btn-secondary {
  background: var(--surface-container);
  color: var(--on-surface);
}
.btn-secondary:hover:not(:disabled) {
  background: var(--surface-container-high);
}

.btn-warm {
  background: var(--tertiary-container);
  color: var(--on-tertiary-container);
}
.btn-warm:hover:not(:disabled) {
  background: var(--illus-mustard);
}

.btn-audio {
  background: var(--illus-cream);
  color: var(--primary);
  border: var(--border-soft);
  padding: 0.45rem 0.9rem;
  font-size: 0.875rem;
}
.btn-audio:hover:not(:disabled) {
  background: var(--primary-container);
  color: var(--on-primary-container);
}
.btn-audio.is-speaking {
  background: var(--primary);
  color: var(--on-primary);
}

/* Prominent Bottom Page-Turn Bar */
.page-turn-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-md);
  background: var(--surface-container-low);
  border-radius: var(--rounded-lg);
  padding: var(--space-md) var(--space-lg);
  border: var(--border-soft);
}

.btn-page-nav {
  min-height: 52px;
  padding: 0.75rem 1.35rem;
  font-size: 1rem;
  border-radius: var(--rounded);
}

.page-counter-badge {
  font-family: var(--font-label);
  font-size: 0.875rem;
  font-weight: 600;
  color: var(--on-surface-variant);
  background: var(--illus-cream);
  padding: 0.5rem 1rem;
  border-radius: var(--rounded-full);
  border: var(--border-soft);
}

/* Illustration Frames */
.illus-frame {
  background: var(--illus-sky);
  border-radius: var(--rounded-lg);
  border: var(--border-soft);
  overflow: hidden;
  position: relative;
}
.illus-frame svg {
  display: block;
  width: 100%;
  height: auto;
}

.clickable-svg-item {
  cursor: pointer;
  transition: transform var(--dur-short) var(--ease-out), opacity var(--dur-short) var(--ease-out);
  transform-box: fill-box;
  transform-origin: center;
}
.clickable-svg-item:hover {
  transform: scale(1.08);
}
.clickable-svg-item.is-counted {
  filter: drop-shadow(0 0 6px var(--illus-gold));
  transform: scale(1.1);
}

/* Speech Bubbles & Dialogue */
.dialogue-stack {
  display: grid;
  gap: var(--space-sm);
}

.speech-row {
  display: flex;
  align-items: flex-start;
  gap: var(--space-sm);
}
.speech-row.is-right {
  flex-direction: row-reverse;
}

.avatar-badge {
  width: 48px;
  height: 48px;
  flex-shrink: 0;
  border-radius: var(--rounded-full);
  background: var(--tertiary-container);
  border: 2px solid var(--outline-variant);
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.avatar-badge.is-green {
  background: var(--primary-container);
}

.speech-bubble {
  background: var(--background);
  border: var(--border-soft);
  border-radius: var(--rounded-lg);
  padding: 0.75rem 1rem;
  box-shadow: var(--shadow-soft);
  flex: 1;
  display: grid;
  gap: 0.35rem;
}
.speech-bubble.is-partner {
  background: var(--primary-container);
  color: var(--on-primary-container);
}
.speech-speaker {
  font-family: var(--font-label);
  font-size: 0.75rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--tertiary);
  font-weight: 600;
}
.speech-text {
  font-weight: 700;
  margin: 0;
  line-height: 1.4;
}

/* Companion Selector */
.companion-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: var(--space-md);
}

.companion-card {
  background: var(--background);
  border: 2px solid var(--outline-variant);
  border-radius: var(--rounded-lg);
  padding: var(--space-md);
  display: grid;
  justify-items: center;
  text-align: center;
  gap: 0.5rem;
  cursor: pointer;
  transition: transform var(--dur-short) var(--ease-out), border-color var(--dur-short) var(--ease-out), background-color var(--dur-short) var(--ease-out);
}
.companion-card:hover {
  transform: translateY(-2px);
  border-color: var(--primary);
}
.companion-card.is-selected {
  background: var(--primary-container);
  border-color: var(--primary);
  box-shadow: var(--shadow-soft);
}

/* Number Showcase & Interactive Tiles */
.number-grid-buttons {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(56px, 1fr));
  gap: 0.45rem;
}

.num-chip {
  min-height: 46px;
  border-radius: var(--rounded);
  border: var(--border-soft);
  background: var(--background);
  color: var(--on-surface);
  font-family: var(--font-headline);
  font-weight: 700;
  font-size: 1.15rem;
  cursor: pointer;
  transition: background-color var(--dur-micro) var(--ease-out), transform var(--dur-micro) var(--ease-out);
}
.num-chip:hover {
  background: var(--tertiary-container);
  transform: translateY(-1px);
}
.num-chip.is-active {
  background: var(--primary);
  color: var(--on-primary);
}

.big-number-stage {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-lg);
  background: var(--background);
  border-radius: var(--rounded-lg);
  padding: var(--space-lg);
  border: var(--border-soft);
}

.big-numeral {
  font-family: var(--font-headline);
  font-size: clamp(3rem, 2.2rem + 2vw, 4.25rem);
  font-weight: 700;
  line-height: 1;
  color: var(--primary);
  font-variant-numeric: tabular-nums;
}

.number-word-title {
  font-family: var(--font-headline);
  font-size: 1.75rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--on-surface);
  margin: 0;
}

.visual-count-tray {
  display: flex;
  flex-wrap: wrap;
  gap: 0.45rem;
  margin-top: var(--space-sm);
}

.count-token-btn {
  min-width: 44px;
  min-height: 44px;
  border-radius: var(--rounded);
  border: var(--border-soft);
  background: var(--surface-container-low);
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: 0.25rem;
  transition: transform var(--dur-micro) var(--ease-out), background-color var(--dur-micro) var(--ease-out);
}
.count-token-btn:hover { transform: scale(1.08); }
.count-token-btn.is-tapped {
  background: var(--tertiary-container);
  border-color: var(--tertiary);
  transform: scale(1.08);
}

/* Tabs inside a chapter */
.subtabs {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-sm);
}
.subtab-btn {
  min-height: 44px;
  padding: 0.5rem 1rem;
  border-radius: var(--rounded-full);
  border: var(--border-soft);
  background: var(--surface-container-low);
  color: var(--on-surface);
  font-weight: 700;
  font-size: 0.9rem;
  cursor: pointer;
}
.subtab-btn.is-active {
  background: var(--primary);
  color: var(--on-primary);
}

/* Feedback Banner */
.feedback-banner {
  border-radius: var(--rounded);
  padding: 0.75rem 1rem;
  font-weight: 700;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-sm);
  min-height: 48px;
}
.feedback-banner.is-neutral {
  background: var(--surface-container);
  color: var(--on-surface);
}
.feedback-banner.is-success {
  background: var(--positive-bg);
  color: var(--on-primary-container);
}
.feedback-banner.is-try {
  background: var(--warning-bg);
  color: var(--on-tertiary-container);
}

/* Choice / Answer Buttons */
.choice-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-sm);
}
.choice-btn {
  min-height: 44px;
  padding: 0.55rem 1.1rem;
  border-radius: var(--rounded);
  border: var(--border-soft);
  background: var(--background);
  color: var(--on-surface);
  font-weight: 700;
  cursor: pointer;
  transition: background-color var(--dur-micro) var(--ease-out), transform var(--dur-micro) var(--ease-out);
}
.choice-btn:hover {
  background: var(--tertiary-container);
  transform: translateY(-1px);
}
.choice-btn.is-correct {
  background: var(--primary);
  color: var(--on-primary);
}
.choice-btn.is-wrong {
  background: var(--error-bg);
  color: var(--error);
}

/* Form Labels & Inputs */
.field-group {
  display: grid;
  gap: 0.35rem;
}
.field-label {
  font-weight: 700;
  font-size: 0.9rem;
  color: var(--on-surface);
}
.text-input {
  min-height: 44px;
  padding: 0.5rem 0.875rem;

function ensureAudioCtx() {
  if (!audioCtx) {
    const AudioContextClass = window.AudioContext || window.webkitAudioContext;
    if (AudioContextClass) {
      audioCtx = new AudioContextClass();
    }
  }
  if (audioCtx && audioCtx.state === `suspended`) {
    audioCtx.resume().catch(() => {});
  }
  return audioCtx;
}

function playTone(freq, duration = 0.16, type = `triangle`, gainLevel = 0.12) {
  if (!appState.soundEnabled) return;
  try {
    const ctx = ensureAudioCtx();
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    gain.gain.setValueAtTime(gainLevel, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + duration);
  } catch (e) {}
}

function playCountChime(stepIndex) {
  const scale = [523.25, 587.33, 659.25, 698.46, 783.99, 880.0, 987.77, 1046.5];
  playTone(scale[stepIndex % scale.length], 0.18, `triangle`, 0.12);
}

function playSuccessFanfare() {
  if (!appState.soundEnabled) return;
  const notes = [523.25, 659.25, 783.99, 1046.5];
  notes.forEach((f, idx) => {
    setTimeout(() => playTone(f, 0.24, `triangle`, 0.13), idx * 95);
  });
}

function playGentleTrySound() {

}

function playAnimalSoundEffect(animalId) {
  if (!appState.soundEnabled) return;
  try {
    const ctx = ensureAudioCtx();
    if (!ctx) return;
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    if (animalId === `cow`) {
      osc.type = `sawtooth`;
      osc.frequency.setValueAtTime(145, now);
      osc.frequency.linearRampToValueAtTime(115, now + 0.45);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now + 0.5);
    } else if (animalId === `duck`) {
      osc.type = `square`;
      osc.frequency.setValueAtTime(420, now);
      osc.frequency.linearRampToValueAtTime(310, now + 0.14);
      gain.gain.setValueAtTime(0.06, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now + 0.16);
    } else if (animalId === `sheep`) {
      osc.type = `triangle`;
      osc.frequency.setValueAtTime(340, now);
      osc.frequency.setValueAtTime(300, now + 0.1);
      osc.frequency.setValueAtTime(340, now + 0.2);
      gain.gain.setValueAtTime(0.09, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now + 0.35);
    } else if (animalId === `horse`) {
      osc.type = `sawtooth`;
      osc.frequency.setValueAtTime(520, now);
      osc.frequency.exponentialRampToValueAtTime(240, now + 0.35);
      gain.gain.setValueAtTime(0.06, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.38);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now + 0.38);
    } else {
      osc.type = `sine`;
      osc.frequency.setValueAtTime(210, now);
      osc.frequency.linearRampToValueAtTime(290, now + 0.12);
      gain.gain.setValueAtTime(0.11, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now + 0.16);
    }
  } catch (e) {}
}

function speakText(text, btnEl) {
  if (!appState.soundEnabled) {
    playTone(440, 0.1, `sine`, 0.06);
    return;
  }
  try {
    if (`speechSynthesis` in window) {
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.lang = `en-US`;
      utter.rate = 0.9;
      utter.pitch = 1.05;
      if (btnEl) {
        btnEl.classList.add(`is-speaking`);
        utter.onend = () => btnEl.classList.remove(`is-speaking`);
        utter.onerror = () => btnEl.classList.remove(`is-speaking`);
      }
      window.speechSynthesis.speak(utter);
    } else {
      playTone(587.33, 0.15, `triangle`, 0.1);
    }
  } catch (e) {
    playTone(587.33, 0.15, `triangle`, 0.1);
  }
}

function toggleAudio() {
  appState.soundEnabled = !appState.soundEnabled;
  if (!appState.soundEnabled && `speechSynthesis` in window) {

  updateHeaderUI();

}

function updateHeaderUI() {
  const avatar = document.getElementById(`header-companion-avatar`);
  if (avatar) avatar.innerHTML = svgCompanionFace(appState.companion, 44);

  const starsEl = document.getElementById(`stat-stars`);
  if (starsEl) {
    const sp = starsEl.querySelector(`span`);
    if (sp) sp.textContent = `${appState.stars} Stars`;
  }

  const stickersEl = document.getElementById(`stat-stickers`);
  if (stickersEl) {
    const sp = stickersEl.querySelector(`span`);
    if (sp) sp.textContent = `${appState.stickers.length} / 7 Stickers`;
  }

  const soundBtn = document.getElementById(`sound-toggle-btn`);
  if (soundBtn) {
    const sp = soundBtn.querySelector(`span`);
    if (sp) sp.textContent = appState.soundEnabled ? `Voice: On` : `Voice: Off`;
  }

  const strip = document.getElementById(`chapter-cells`);
  if (strip) {
    strip.innerHTML = PAGES.map((p, i) => {
      const isCur = i === appState.currentPage;
      const isDone = appState.completedPages.includes(i);
      return `<button type="button" class="chapter-cell ${isCur ? `is-current` : isDone ? `is-done` : ``}" onclick="goToPage(${i})">${p.short}</button>`;
    }).join(``);
  }

  const prevBtn = document.getElementById(`btn-prev-page`);
  const nextBtn = document.getElementById(`btn-next-page`);
  const prevLbl = document.getElementById(`prev-page-label`);
  const nextLbl = document.getElementById(`next-page-label`);
  const counter = document.getElementById(`page-counter-badge`);

  if (counter) counter.textContent = `Page ${appState.currentPage + 1} of ${PAGES.length}`;
  if (prevBtn) prevBtn.disabled = appState.currentPage === 0;
  if (nextBtn) nextBtn.disabled = appState.currentPage === PAGES.length - 1;
  if (prevLbl) prevLbl.textContent = appState.currentPage > 0 ? `Previous: ${PAGES[appState.currentPage - 1].title}` : `First Page`;
  if (nextLbl) nextLbl.textContent = appState.currentPage < PAGES.length - 1 ? `Next: ${PAGES[appState.currentPage + 1].title}` : `End of Book`;
}

function renderCurrentPage() {
  const stage = document.getElementById(`storybook-stage`);
  if (!stage) return;

  const renderers = [
    renderPage0Opening,
    renderPage1Map,
    renderPage2Garden,
    renderPage3Market,
    renderPage4Bakery,
    renderPage5Farm,
    renderPage6Classroom,
    renderPage7ToyShop,
    renderPage8Tower,
    renderPage9Missions
  ];

  const fn = renderers[appState.currentPage] || renderPage0Opening;
  stage.innerHTML = fn();
  updateHeaderUI();

  if (window.lucide && typeof window.lucide.createIcons === `function`) {
    try { window.lucide.createIcons(); } catch (e) {}
  }
}

function goToPage(index) {
  if (index < 0 || index >= PAGES.length) return;
  appState.currentPage = index;
  renderCurrentPage();
  saveAppState();
  window.scrollTo({ top: 0, behavior: `smooth` });
}

function nextPage() {
  goToPage(appState.currentPage + 1);
}

function prevPage() {
  goToPage(appState.currentPage - 1);
}

  if (!appState.gardenMissionTapped.includes(itemIdx)) {

      const countNow = appState.gardenMissionTapped.length;

      speakText(NUMBER_WORDS[countNow]);

      renderCurrentPage();
      saveAppState();

  const cur = appState.toyBasket[id] || 0;

  const spent = TOY_ITEMS.reduce((sum, t) => sum + (appState.toyBasket[t.id] || 0) * t.price, 0);
  if (delta > 0 && toy && spent + toy.price > 10) return;
  appState.toyBasket[id] = Math.max(0, cur + delta);
  playTone(delta > 0 ? 659.25 : 440, 0.1);
  renderCurrentPage();
  saveAppState();
}

  if (isGood) {
    appState.toyDialogueStep = 1;
    addStar(1);
    speakText(`I want two balls, please. How much is it? They cost four dollars. Here you are!`);
    renderCurrentPage();
    saveAppState();
  } else {
    if (btn) btn.classList.add(`is-wrong`);
    playGentleTrySound();
  }
}

// Tower Handlers
function setTowerTab(t) {
  appState.towerTab = t;
  renderCurrentPage();
  saveAppState();
}

function answerTowerMissing(n, btn) {
  const fb = document.getElementById(`tower-a-fb`);
  if (n === 16) {
    appState.towerMissingAns = `16`;
    addStar(1);
    playSuccessFanfare();
    speakText(`Sixteen! Fourteen, fifteen, sixteen, seventeen, eighteen.`);
    renderCurrentPage();
  } else {
    if (btn) btn.classList.add(`is-wrong`);
    playGentleTrySound();
    if (fb) {
      fb.className = `feedback-banner is-try`;
      fb.innerHTML = `<span>Let us count again: 14, 15, ..., 17!</span>`;
    }
  }
}

function adjustTensOnes(which, delta) {
  if (which === `tens`) {
    appState.towerTens = Math.max(2, Math.min(5, appState.towerTens + delta));
    if (appState.towerTens === 5) appState.towerOnes = 0;
  } else {
    const maxOnes = appState.towerTens === 5 ? 0 : 9;
    appState.towerOnes = Math.max(0, Math.min(maxOnes, appState.towerOnes + delta));
  }
  playTone(587.33, 0.1);
  renderCurrentPage();
  saveAppState();
}

function checkTowerTreasure(n, btn) {
  const fb = document.getElementById(`tower-c-fb`);
  if (n === 75) {
    awardSticker(`tower`, 8);
    speakText(`Seventy-five! You found the Clock Tower treasure!`);
    renderCurrentPage();
  } else {
    if (btn) btn.classList.add(`is-wrong`);
    playGentleTrySound();
    if (fb) {
      fb.className = `feedback-banner is-try`;
      fb.innerHTML = `<span>That is ${n}. Try finding seventy-five (75)!</span>`;
    }
  }
}

function checkTowerSort(isCorrect, btn) {
  const fb = document.getElementById(`tower-sort-fb`);
  if (isCorrect) {
    if (btn) btn.classList.add(`is-correct`);
    addStar(1);
    playSuccessFanfare();
    speakText(`Fifty-two, sixty-seven, eighty-four, one hundred!`);
    if (fb) {
      fb.className = `feedback-banner is-success`;
      fb.innerHTML = `<span>You got it! 52 &rarr; 67 &rarr; 84 &rarr; 100!</span>`;
    }
  } else {
    if (btn) btn.classList.add(`is-wrong`);
    playGentleTrySound();
    if (fb) {
      fb.className = `feedback-banner is-try`;
      fb.innerHTML = `<span>Look for the smallest number first: 52!</span>`;
    }
  }
}

// Page 9 Real-Life Missions Handlers
function updateUserAge(val) {
  appState.userAge = Number(val) || 8;
  renderCurrentPage();
  saveAppState();
}

function setRoutine(idx) {
  appState.routineIdx = idx;
  const phrases = [`Wake up at 6 o'clock.`, `Go to school at 7 o'clock.`, `Have lunch at 12 o'clock.`];
  speakText(phrases[idx] || phrases[0]);
  renderCurrentPage();
  saveAppState();
}

function updateFamilyCount(val) {
  appState.familyCount = Math.max(1, Math.min(20, Number(val) || 1));
  saveAppState();
}

function advanceChat() {
  if (appState.chatStep === 0) {
    appState.chatStep = 1;
    addStar(1);
    speakText(`Sure! Here you are! Can I buy two apples?`);
    renderCurrentPage();
    saveAppState();
  } else {
    speakText(`Hi! How many apples do you have? I have five apples. Can I buy two apples? Sure!`);
  }
}

function adjustMyList(key, delta) {
  appState.myShopList[key] = Math.max(0, Math.min(10, (appState.myShopList[key] || 0) + delta));
  playTone(523.25, 0.1);
  renderCurrentPage();
  saveAppState();
}

function handleResetProgress(btn) {
  if (!btn) return;
  if (btn.dataset.armed !== `true`) {
    btn.dataset.armed = `true`;
    btn.innerHTML = `<span>Click again to confirm reset</span>`;
    return;
  }
  appState = {
    currentPage: 0,
    companion: `lily`,
    soundEnabled: true,
    stars: 0,
    stickers: [],
    completedPages: [],
    gardenSelectedNum: 5,
    gardenTappedTokens: 0,
    gardenMissionIdx: 0,
    gardenMissionTapped: [],
    marketSelectedIdx: 0,
    marketBasketTapped: 0,
    marketCompareAnswered: false,
    bakeryCart: { cookie: 0, bread: 0, donut: 0, milk: 0, cake: 0 },
    bakeryDone: false,
    farmActiveAnimal: `cow`,
    farmAnsweredCount: false,
    farmAnsweredCompare: false,
    classMissionIdx: 0,
    classFoundIds: [],
    realChairs: `4`,
    toyDialogueStep: 0,
    toyBasket: {},
    toyBudgetDone: false,
    towerTab: `A`,
    towerMissingAns: ``,
    towerTens: 3,
    towerOnes: 5,
    towerSortOrder: [84, 52, 100, 67],
    towerTargetNum: 75,
    userAge: 8,
    routineIdx: 0,
    familyCount: 4,
    chatStep: 0,
    myShopList: { apples: 2, bananas: 3, milk: 1 }
  };
  saveAppState();
  renderCurrentPage();
}

function downloadCertificate() {
  const certText = [
    `================================================`,
    `   THE WONDERFUL WORLD OF NUMBERS - CERTIFICATE`,
    `================================================`,
    `Explorer Companion: ${getCompanionName()}`,
    `Learner Age: ${appState.userAge} years old`,
    `Stars Earned: ${appState.stars}`,
    `Town Stickers Collected: ${appState.stickers.length} / 7`,
    `Stickers: ${appState.stickers.length ? appState.stickers.join(`, `) : `Just getting started!`}`,
    `------------------------------------------------`,
    `Awarded for exploring numbers 1-100 in English!`,
    `================================================`
  ].join(`\n`);

  if (window.notebookAppApi && typeof window.notebookAppApi.triggerFileDownload === `function`) {
    window.notebookAppApi.triggerFileDownload({
      content: certText,
      contentType: `text/plain`,
      encoding: `UTF-8`,
      filename: `number-town-certificate.txt`
    });
  }
}

// =========================================================================
// 8. INITIALIZATION
// =========================================================================
async function initStorybook() {
  try {
    if (window.notebookAppApi && typeof window.notebookAppApi.getAppState === `function`) {
      const saved = await window.notebookAppApi.getAppState();
      if (saved && typeof saved === `object`) {
        appState = Object.assign({}, appState, saved);
      }
    }
  } catch (e) {}

  renderCurrentPage();

  try {
    if (window.notebookAppApi && typeof window.notebookAppApi.notifyAppReady === `function`) {
      window.notebookAppApi.notifyAppReady();
    }
  } catch (e) {}
}

document.addEventListener(`DOMContentLoaded`, initStorybook);
</script>
